name: Foundation CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Secret/private export scan
        run: python tools/security/secret_scan.py
      - name: Release audit
        run: python tools/security/release_audit.py

  go:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - tools/testing/policyfixtures
          - s0/agent-registry-service
          - s0/passport-issuance-engine
          - sx/s0s1-rest-bff
          - sx/are-api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - s0/immutable-ledger
          - s1/scope-evaluator-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup default stable
      - name: cargo test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  node:
    name: Node/OPA tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: s1/opa-integration-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: s1/opa-integration-layer/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm audit --audit-level=high

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    needs: [hygiene, go, rust, node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start foundation stack
        run: |
          python tools/gates/generate_dev_certs.py
          docker compose -f deploy/compose/docker-compose.yml up -d --build
      - name: Smoke foundation flow
        run: python tools/smoke/foundation_smoke.py
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color
      - name: Stop foundation stack
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
